<div class="admin-shell">
  <header class="admin-topbar">
    <a class="brand" routerLink="/admin/dashboard">
      <span class="brand__logo"><img src="assets/logo.png" alt=""></span>
      <span class="brand__text">
        <b>British Kingdom</b>
        <em>espace de gestion</em>
      </span>
    </a>
    <div class="admin-topbar__right">
      <a class="ghost-btn see-site" href="https://chatterie-british-kingdom.fr/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <span>Voir le site</span>
      </a>
      <button class="ghost-btn logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </header>

  <div class="admin-body">
    <nav class="admin-nav" aria-label="Espace de gestion">
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="12" width="4.5" height="8" rx="1.6"/><rect x="9.8" y="7" width="4.5" height="13" rx="1.6"/><rect x="16.5" y="3.5" width="4.5" height="16.5" rx="1.6"/></svg></span>
        <span class="label">Visites</span>
      </a>
      <a routerLink="/admin/chats" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.05Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></span>
        <span class="label">Chats</span>
      </a>
      <a routerLink="/admin/portees" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></span>
        <span class="label">Portées</span>
      </a>
      <a routerLink="/admin/liste-attente" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>
        <span class="label">Attente</span>
      </a>
      <a routerLink="/admin/messages" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span class="label">Messages</span>
      </a>
      <a routerLink="/admin/blog" routerLinkActive="active">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
        <span class="label">Blog</span>
      </a>
    </nav>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
