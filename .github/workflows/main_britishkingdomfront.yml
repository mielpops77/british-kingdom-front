# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - BritishKingdomFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      # Les listes du site public (chats, portées, articles), le plan du site et llms.txt sont refaits avec
      # les données du jour de l'API, pour les robots qui n'exécutent pas JavaScript (assistants d'IA).
      # Si l'API ne répond pas, les pages du dépôt partent telles quelles.
      - name: Refresh the public pages with today's data (site-v2)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python site-v2/_build/pages.py || echo "Pages du dépôt publiées telles quelles"

      # Le nouveau site public (dossier site-v2) remplace les pages publiques de l'application Angular.
      # Celle-ci ne sert plus que l'espace de gestion, sur /admin : son index devient admin.html,
      # et le web.config de site-v2/_deploy envoie toutes les adresses /admin/… vers ce fichier.
      - name: Assemble the public site (site-v2) with the admin (Angular)
        shell: bash
        run: |
          set -e
          OUT=dist/British-Kingdom/browser
          test -f "$OUT/index.html"
          mv "$OUT/index.html" "$OUT/admin.html"
          cp -r site-v2/. "$OUT/"
          rm -rf "$OUT/_build" "$OUT/_deploy" "$OUT/README.md"
          cp site-v2/_deploy/web.config "$OUT/web.config"
          # Les deux vidéos de l'ancien site Angular (110 Mo) ne servent plus à rien en ligne :
          # elles restent dans le dépôt (src/assets), mais ne sont plus envoyées au serveur.
          rm -f "$OUT/assets/vidos.mp4" "$OUT/assets/IMG_9201.mp4"
          test -f "$OUT/index.html" && test -f "$OUT/admin.html" && test -f "$OUT/web.config" && test -f "$OUT/js/photos-hd.js"
          ls "$OUT" | head -50

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/British-Kingdom/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        id: deploy-to-webapp
        with:
          app-name: 'BritishKingdomFront'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      # Prévient Bing (qui alimente ChatGPT et Copilot), Yandex, Seznam… de toutes les pages du plan
      # du site (protocole IndexNow). La clé est le fichier <32 caractères>.txt publié à la racine.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          python3 - "$KEY" <<'EOF'
          import json, re, sys, urllib.request
          key = sys.argv[1]
          urls = [u.replace("&amp;", "&") for u in re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())]
          body = json.dumps({"host": "chatterie-british-kingdom.fr", "key": key,
                             "keyLocation": "https://chatterie-british-kingdom.fr/%s.txt" % key, "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow :", urllib.request.urlopen(req, timeout=30).status, "-", len(urls), "adresses envoyées")
          EOF
